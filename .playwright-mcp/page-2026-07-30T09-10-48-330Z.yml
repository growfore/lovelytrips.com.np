        - generic [ref=e23]:
          - paragraph [ref=e24]: Lovely Trips is a small collective of professional mountain guides, alpinists, and storytellers who spend more days above tree line than in the office. For over a decade we've been leading travelers of every experience level into ranges from the Dolomites to the Caucasus.
          - paragraph [ref=e25]: Every route we run is scouted personally, every group is capped at twelve people, and every meal on the trail is cooked from scratch. What you get is a real expedition — not a tour — with the safety and comfort of a team that has done this hundreds of times before.
          - paragraph [ref=e26]: Come as a stranger, leave with a rope team.
